[package]
name = "ses_downloader_pw"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
calamine = "0.38.0"
chrono = "0.4.45"
dotenvy = "0.15"
playwright-rs = "0.21"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rust_xlsxwriter = "0.103.0"
